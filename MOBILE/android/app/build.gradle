apply plugin: 'com.android.application'

def isReleaseTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def requireGoogleServicesForRelease =
    ((project.findProperty("tradequipRequireGoogleServicesForRelease") ?: System.getenv("TRADEQUIP_REQUIRE_GOOGLE_SERVICES_FOR_RELEASE") ?: "0").toString() == "1")
def requireReleaseSigning =
    ((project.findProperty("tradequipRequireReleaseSigning") ?: System.getenv("TRADEQUIP_REQUIRE_RELEASE_SIGNING") ?: "1").toString() == "1")
def servicesJSON = file('google-services.json')
def hasGoogleServices = servicesJSON.exists() && servicesJSON.length() > 0

File resolveSigningPath(File baseFile, Object rawPath) {
    if (rawPath == null) return null
    def text = rawPath.toString().trim()
    if (!text) return null
    File candidate = new File(text)
    if (!candidate.isAbsolute() && baseFile != null) {
        candidate = new File(baseFile.parentFile, text)
    }
    return candidate
}

File operatorManagedAndroidSigningHome() {
    def userHome = System.getProperty("user.home")
    if (userHome == null || !userHome.trim()) {
        return null
    }
    return new File(new File(new File(userHome), ".config"), "tradequip/android-signing")
}

// Load release signing config from an operator-managed key.properties path.
def defaultKeystorePropertiesFile = operatorManagedAndroidSigningHome() != null
    ? new File(operatorManagedAndroidSigningHome(), "key.properties")
    : null
def keystorePropertiesPath = (
    project.findProperty("tradequipAndroidKeyPropertiesPath")
        ?: System.getenv("TRADEQUIP_ANDROID_KEY_PROPERTIES")
        ?: ""
).toString().trim()
def keystorePropertiesFile = keystorePropertiesPath
    ? file(keystorePropertiesPath)
    : defaultKeystorePropertiesFile
def keystoreProperties = new Properties()
def hasReleaseSigningConfig = keystorePropertiesFile != null && keystorePropertiesFile.exists()
if (hasReleaseSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def releaseStoreFile = resolveSigningPath(keystorePropertiesFile, keystoreProperties['storeFile'])
if (isReleaseTask && requireReleaseSigning) {
    if (!hasReleaseSigningConfig) {
        throw new GradleException(
            "Release signing requires an operator-managed key.properties file at ${defaultKeystorePropertiesFile} or an override via TRADEQUIP_ANDROID_KEY_PROPERTIES / -PtradequipAndroidKeyPropertiesPath."
        )
    }
    if (releaseStoreFile == null || !releaseStoreFile.exists()) {
        throw new GradleException("Configured Android release keystore file was not found.")
    }
}

android {
    namespace = "com.tradequip.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tradequip.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    
    // Signing configuration for release builds
    signingConfigs {
        release {
            if (hasReleaseSigningConfig) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile releaseStoreFile
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    
    packaging {
        resources {
            excludes += ['**/*.gz', '**/*.br']
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Use signing config for release builds
            if (hasReleaseSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// Capacitor sync may copy precompressed (.gz/.br) web assets. Android's asset merge
// strips these extensions, which causes duplicate asset names and fails the build.
tasks.register("prunePrecompressedWebAssets", Delete) {
    delete fileTree(dir: "src/main/assets/public", includes: ["**/*.gz", "**/*.br"])
}
tasks.named("preBuild").configure {
    dependsOn("prunePrecompressedWebAssets")
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    if (hasGoogleServices) {
        apply plugin: 'com.google.gms.google-services'
    } else if (isReleaseTask) {
        logger.warn("WARNING: google-services.json not found — release APK will build without push notification support")
        if (requireGoogleServicesForRelease) {
            throw new GradleException("google-services.json is required for release when TRADEQUIP_REQUIRE_GOOGLE_SERVICES_FOR_RELEASE=1")
        }
    }
} catch(Exception e) {
    throw e
}
