apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradehub-minio-monitor
  namespace: tradehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradehub-minio-monitor
  template:
    metadata:
      labels:
        app: tradehub-minio-monitor
    spec:
      containers:
        - name: minio-monitor
          image: python:3.12-slim
          command:
            - /bin/sh
            - -lc
            - |
              pip install --no-cache-dir minio
              python /opt/minio_monitor/monitor.py
          env:
            - name: MINIO_ENDPOINT
              value: tradehub-minio.tradehub.svc.cluster.local:9000
            - name: MINIO_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: tradehub-config
                  key: EXPORT_OBJECT_STORAGE_BUCKET
                  optional: true
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tradehub-secrets
                  key: EXPORT_OBJECT_STORAGE_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tradehub-secrets
                  key: EXPORT_OBJECT_STORAGE_SECRET_KEY
          volumeMounts:
            - name: script
              mountPath: /opt/minio_monitor
      volumes:
        - name: script
          configMap:
            name: tradehub-minio-monitor-script
---
