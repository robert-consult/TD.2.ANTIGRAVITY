apiVersion: v1
kind: ConfigMap
metadata:
  name: tradehub-pigsty-meta-bootstrap-sql
  namespace: tradehub
data:
  bootstrap.sql: |
    CREATE SCHEMA IF NOT EXISTS monitor;
    CREATE SCHEMA IF NOT EXISTS pigsty;

    CREATE TABLE IF NOT EXISTS monitor.meta_bootstrap (
      id BIGSERIAL PRIMARY KEY,
      bootstrapped_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      note TEXT NOT NULL
    );

    INSERT INTO monitor.meta_bootstrap(note)
    VALUES ('TradeHub Pigsty metadata bootstrap applied')
    ON CONFLICT DO NOTHING;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tradehub-pigsty-meta-bootstrap
  namespace: tradehub
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: tradehub-pigsty-meta-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: psql
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -lc
            - psql -f /sql/bootstrap.sql
          env:
            - name: PGHOST
              value: pgbouncer.tradehub.svc.cluster.local
            - name: PGPORT
              value: "6432"
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: tradehub-secrets
                  key: POSTGRES_DB
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: tradehub-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: tradehub-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: sql
              mountPath: /sql
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: tradehub-pigsty-meta-bootstrap-sql
