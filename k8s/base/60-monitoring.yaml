apiVersion: v1
kind: ServiceAccount
metadata:
  name: tradehub-prometheus
  namespace: tradehub
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tradehub-prometheus-adapter
  namespace: tradehub
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tradehub-prometheus-config
  namespace: tradehub
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts-admin-data-slo.yml
      - /etc/prometheus/tradehub-observability-rules.yml
      - /etc/prometheus-ops/*.yaml
    scrape_configs:
      - job_name: "node-exporter"
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: tradehub;node-exporter;metrics
      - job_name: "kube-state-metrics"
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: tradehub;kube-state-metrics;http-metrics
      - job_name: "tradehub-api"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: tradehub;tradehub-api;http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: "tradehub-worker"
        metrics_path: /metrics
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: tradehub;tradehub-worker;http
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
      - job_name: "tradehub-minio"
        metrics_path: /minio/v2/metrics/cluster
        static_configs:
          - targets: ["tradehub-minio.tradehub.svc.cluster.local:9000"]
      - job_name: "tradehub-clickhouse"
        metrics_path: /metrics
        static_configs:
          - targets: ["tradehub-clickhouse.tradehub.svc.cluster.local:8123"]
      - job_name: "tradehub-valkey-exporter"
        static_configs:
          - targets: ["tradehub-valkey-exporter.tradehub.svc.cluster.local:9121"]
      - job_name: "tradehub-postgres-exporter"
        scrape_interval: 30s
        static_configs:
          - targets: ["tradehub-postgres-exporter.tradehub.svc.cluster.local:9630"]
            labels:
              cls: tradehub
              ins: tradehub-postgres
              ip: postgres.tradehub.svc.cluster.local
      - job_name: "tradehub-pgbouncer-exporter"
        scrape_interval: 30s
        static_configs:
          - targets: ["tradehub-pgbouncer-exporter.tradehub.svc.cluster.local:9630"]
            labels:
              cls: tradehub
              ins: tradehub-pgbouncer
              ip: pgbouncer.tradehub.svc.cluster.local
      - job_name: "tradehub-victoria-logs"
        scrape_interval: 30s
        static_configs:
          - targets: ["tradehub-victoria-logs.tradehub.svc.cluster.local:9428"]
            labels:
              cls: vlogs
              ins: tradehub-victoria-logs
              ip: tradehub-victoria-logs.tradehub.svc.cluster.local
      - job_name: "tradehub-victoria-traces"
        scrape_interval: 30s
        static_configs:
          - targets: ["tradehub-victoria-traces.tradehub.svc.cluster.local:10428"]
            labels:
              cls: vtraces
              ins: tradehub-victoria-traces
              ip: tradehub-victoria-traces.tradehub.svc.cluster.local
  alerts-admin-data-slo.yml: |
    groups:
      - name: tradehub-admin-data-slo
        interval: 30s
        rules:
          - alert: TradehubAdminExportQueueBacklogWarning
            expr: admin_data_export_queue_waiting > 200
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Admin export queue backlog is elevated"
              description: "admin_data_export_queue_waiting > 200 for 10 minutes."
          - alert: TradehubAdminExportQueueBacklogCritical
            expr: admin_data_export_queue_waiting > 1000
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Admin export queue backlog is critical"
              description: "admin_data_export_queue_waiting > 1000 for 10 minutes."
          - alert: TradehubAdminExportFailuresHigh
            expr: increase(admin_data_export_jobs_failed_total[15m]) > 20
            for: 3m
            labels:
              severity: critical
            annotations:
              summary: "Admin exports are failing"
              description: "More than 20 export job failures in 15 minutes."
          - alert: TradehubAdminExportThroughputStalled
            expr: admin_data_export_queue_waiting > 0 and (time() - admin_data_export_last_success_at) > 1800
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Admin export pipeline throughput is stalled"
              description: "Queue has pending jobs and no success event for 30 minutes."
          - alert: TradehubAdminRollupRefreshStale
            expr: (time() - admin_data_rollup_refresh_last_success_at) > 3600
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Admin rollup refresh is stale"
              description: "No successful rollup refresh has completed for over 1 hour."
          - alert: TradehubAdminRollupRefreshFailing
            expr: increase(admin_data_rollup_refresh_failed_total[30m]) > 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Admin rollup refresh failures detected"
              description: "One or more rollup refresh runs failed in the last 30 minutes."
          - alert: TradehubClickHouseSyncStale
            expr: (time() - clickhouse_sync_last_success_at) > 1800 and clickhouse_sync_running == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "ClickHouse sync is stale"
              description: "No successful ClickHouse sync observed for over 30 minutes."
  tradehub-observability-rules.yml: |
    groups:
      - name: tradehub-http-recording
        interval: 30s
        rules:
          - record: tradehub:http_requests:rate5m
            expr: sum by (service, route, operation) (rate(http_requests_total[5m]))
          - record: tradehub:http_errors:rate5m
            expr: sum by (service, route, operation) (rate(http_request_errors_total[5m]))
          - record: tradehub:http_5xx:rate5m
            expr: sum by (service, route, operation) (rate(http_requests_total{status_class="5xx"}[5m]))
          - record: tradehub:http_error_ratio:rate5m
            expr: tradehub:http_errors:rate5m / clamp_min(tradehub:http_requests:rate5m, 0.001)
          - record: tradehub:http_5xx_ratio:rate5m
            expr: tradehub:http_5xx:rate5m / clamp_min(tradehub:http_requests:rate5m, 0.001)
          - record: tradehub:http_latency:p95_5m
            expr: histogram_quantile(0.95, sum by (service, route, operation, le) (rate(http_request_duration_seconds_bucket[5m])))
          - record: tradehub:http_latency:p99_5m
            expr: histogram_quantile(0.99, sum by (service, route, operation, le) (rate(http_request_duration_seconds_bucket[5m])))
          - record: tradehub:http_in_flight:max
            expr: max by (service, route, operation) (http_requests_in_flight)
      - name: tradehub-business-recording
        interval: 30s
        rules:
          - record: tradehub:business_flow_steps:rate5m
            expr: sum by (service, flow, step, outcome) (rate(business_flow_steps_total[5m]))
          - record: tradehub:business_flow_latency:p95_5m
            expr: histogram_quantile(0.95, sum by (service, flow, step, outcome, le) (rate(business_flow_step_duration_seconds_bucket[5m])))
          - record: tradehub:operation_failures:rate15m
            expr: sum by (service, operation, reason) (rate(operation_failures_total[15m]))
          - record: tradehub:background_job_duration:p95_15m
            expr: histogram_quantile(0.95, sum by (service, job, outcome, le) (rate(background_job_duration_seconds_bucket[15m])))
      - name: tradehub-observability-alerts
        interval: 30s
        rules:
          - alert: TradehubPostgresExporterDown
            expr: min_over_time(up{job="tradehub-postgres-exporter"}[10m]) == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "TradeHub Postgres exporter is down"
              description: "Prometheus cannot scrape the canonical Postgres exporter for at least 10 minutes."
          - alert: TradehubPgbouncerExporterDown
            expr: min_over_time(up{job="tradehub-pgbouncer-exporter"}[10m]) == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "TradeHub PgBouncer exporter is down"
              description: "Prometheus cannot scrape the canonical PgBouncer exporter for at least 10 minutes."
          - alert: TradehubVictoriaTracesDown
            expr: min_over_time(up{job="tradehub-victoria-traces"}[10m]) == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "TradeHub VictoriaTraces is down"
              description: "Prometheus cannot scrape VictoriaTraces for at least 10 minutes."
          - alert: TradehubCriticalOperationsErrorBudgetBurnFast
            expr: |
              (
                (
                  sum(rate(http_requests_total{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*",status_class="5xx"}[5m]))
                  /
                  clamp_min(sum(rate(http_requests_total{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*"}[5m])), 0.001)
                ) / 0.005
              ) > 14.4
              and
              (
                (
                  sum(rate(http_requests_total{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*",status_class="5xx"}[1h]))
                  /
                  clamp_min(sum(rate(http_requests_total{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*"}[1h])), 0.001)
                ) / 0.005
              ) > 14.4
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Critical operation 5xx burn rate is exhausting the error budget"
              description: "Critical API operations are burning a 99.5% availability budget faster than the multi-window SRE threshold."
          - alert: TradehubCriticalOperationsErrorBudgetBurnSlow
            expr: |
              (
                (
                  sum(rate(http_requests_total{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*",status_class="5xx"}[30m]))
                  /
                  clamp_min(sum(rate(http_requests_total{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*"}[30m])), 0.001)
                ) / 0.005
              ) > 6
              and
              (
                (
                  sum(rate(http_requests_total{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*",status_class="5xx"}[6h]))
                  /
                  clamp_min(sum(rate(http_requests_total{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*"}[6h])), 0.001)
                ) / 0.005
              ) > 6
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Critical operation 5xx burn rate is elevated"
              description: "Critical API operations are burning a 99.5% availability budget above the long-window threshold."
          - alert: TradehubCriticalOperationsLatencyBurnFast
            expr: |
              (
                (
                  sum(rate(http_request_duration_seconds_count{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*"}[5m]))
                  -
                  sum(rate(http_request_duration_seconds_bucket{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*",le="0.5"}[5m]))
                )
                /
                clamp_min(sum(rate(http_request_duration_seconds_count{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*"}[5m])), 0.001)
              ) / 0.01 > 14.4
              and
              (
                (
                  sum(rate(http_request_duration_seconds_count{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*"}[1h]))
                  -
                  sum(rate(http_request_duration_seconds_bucket{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*",le="0.5"}[1h]))
                )
                /
                clamp_min(sum(rate(http_request_duration_seconds_count{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*"}[1h])), 0.001)
              ) / 0.01 > 14.4
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Critical operation latency burn rate is exhausting the latency budget"
              description: "More than 1% of critical requests are breaching 500ms latency fast enough to exhaust the multi-window latency budget."
          - alert: TradehubCriticalOperationsLatencyBurnSlow
            expr: |
              (
                (
                  sum(rate(http_request_duration_seconds_count{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*"}[30m]))
                  -
                  sum(rate(http_request_duration_seconds_bucket{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*",le="0.5"}[30m]))
                )
                /
                clamp_min(sum(rate(http_request_duration_seconds_count{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*"}[30m])), 0.001)
              ) / 0.01 > 6
              and
              (
                (
                  sum(rate(http_request_duration_seconds_count{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*"}[6h]))
                  -
                  sum(rate(http_request_duration_seconds_bucket{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*",le="0.5"}[6h]))
                )
                /
                clamp_min(sum(rate(http_request_duration_seconds_count{operation=~"auth\\..*|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*"}[6h])), 0.001)
              ) / 0.01 > 6
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Critical operation latency burn rate is elevated"
              description: "Critical API operations are exceeding the 500ms latency SLO above the long-window burn threshold."
          - alert: TradehubBusinessFlowFailuresElevated
            expr: increase(operation_failures_total{operation=~"auth\\.register|legal\\.doc1_accept|challenge\\.(enroll|withdraw)|trade\\.(open|close|cancel)|partner\\.onboarding\\..*|admin\\.data_exports\\..*"}[15m]) > 25
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Business flow failures are elevated"
              description: "Bounded business-operation failures crossed 25 events in the last 15 minutes."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradehub-prometheus
  namespace: tradehub
  labels:
    app: tradehub-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradehub-prometheus
  template:
    metadata:
      labels:
        app: tradehub-prometheus
    spec:
      serviceAccountName: tradehub-prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=24h"
            - "--web.external-url=https://tradehub.example.com/prometheus/"
            - "--web.route-prefix=/"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
            - name: ops-config
              mountPath: /etc/prometheus-ops
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: config
          configMap:
            name: tradehub-prometheus-config
        - name: ops-config
          configMap:
            name: tradehub-prometheus-ops-config
            optional: true
        - name: storage
          persistentVolumeClaim:
            claimName: tradehub-prometheus-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tradehub-prometheus-pvc
  namespace: tradehub
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tradehub-prometheus
  namespace: tradehub
  labels:
    app: tradehub-prometheus
spec:
  type: ClusterIP
  selector:
    app: tradehub-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tradehub-prometheus-adapter-config
  namespace: tradehub
data:
  config.yaml: |
    rules:
      - seriesQuery: 'ws_active_connections{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: "namespace"}
            pod: {resource: "pod"}
        name:
          matches: "^ws_active_connections$"
          as: "ws_active_connections"
        metricsQuery: 'avg(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradehub-prometheus-adapter
  namespace: tradehub
  labels:
    app: tradehub-prometheus-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradehub-prometheus-adapter
  template:
    metadata:
      labels:
        app: tradehub-prometheus-adapter
    spec:
      serviceAccountName: tradehub-prometheus-adapter
      containers:
        - name: adapter
          image: registry.k8s.io/prometheus-adapter/prometheus-adapter:v0.12.0
          args:
            - /adapter
            - --secure-port=6443
            - --cert-dir=/tmp
            - --prometheus-url=http://tradehub-prometheus.tradehub.svc:9090
            - --metrics-relist-interval=30s
            - --config=/etc/adapter/config.yaml
          ports:
            - containerPort: 6443
          volumeMounts:
            - name: config
              mountPath: /etc/adapter
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
      volumes:
        - name: config
          configMap:
            name: tradehub-prometheus-adapter-config
---
apiVersion: v1
kind: Service
metadata:
  name: tradehub-prometheus-adapter
  namespace: tradehub
  labels:
    app: tradehub-prometheus-adapter
spec:
  selector:
    app: tradehub-prometheus-adapter
  ports:
    - name: https
      port: 443
      targetPort: 6443
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.custom.metrics.k8s.io
spec:
  service:
    name: tradehub-prometheus-adapter
    namespace: tradehub
  group: custom.metrics.k8s.io
  version: v1beta1
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 100
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tradehub-prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy", "services", "endpoints", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tradehub-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tradehub-prometheus
subjects:
  - kind: ServiceAccount
    name: tradehub-prometheus
    namespace: tradehub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tradehub-prometheus-adapter
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy", "services", "endpoints", "pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["custom.metrics.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["external.metrics.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tradehub-prometheus-adapter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tradehub-prometheus-adapter
subjects:
  - kind: ServiceAccount
    name: tradehub-prometheus-adapter
    namespace: tradehub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tradehub-prometheus-adapter-auth-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: tradehub-prometheus-adapter
    namespace: tradehub
