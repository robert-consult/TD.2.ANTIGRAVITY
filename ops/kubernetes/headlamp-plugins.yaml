# Headlamp Plugin Configurations
# Mounts custom settings to enhance Headlamp's default view for TradeHub petascale ops.
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-plugins-config
  namespace: tradehub
data:
  # Filter Headlamp's default view to tradehub namespace only
  config.json: |
    {
      "clusters": [
        {
          "name": "tradehub-petascale",
          "server": "https://kubernetes.default.svc",
          "defaultNamespace": "tradehub"
        }
      ],
      "plugins": {
        "prometheus": {
          "enabled": true,
          "url": "/prometheus"
        }
      },
      "externalLinks": [
        {
          "label": "Grafana — Ops Overview",
          "url": "/grafana/d/tradehub-ops-overview",
          "icon": "dashboard"
        },
        {
          "label": "Grafana — HTTP Observability",
          "url": "/grafana/d/tradehub-http-observability",
          "icon": "dashboard"
        },
        {
          "label": "Grafana — Business Flow",
          "url": "/grafana/d/tradehub-business-flow-health",
          "icon": "dashboard"
        },
        {
          "label": "Prometheus",
          "url": "/prometheus",
          "icon": "monitor"
        },
        {
          "label": "Bull Board",
          "url": "/api/admin/data-exports/queues",
          "icon": "queue"
        },
        {
          "label": "MinIO Monitor",
          "url": "/minio-monitor",
          "icon": "storage"
        }
      ]
    }
# Headlamp Deployment is defined in ops/kubernetes/headlamp-deployment.yaml.
