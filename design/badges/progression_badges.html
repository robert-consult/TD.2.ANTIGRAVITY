<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progression Badges: Tiers 1-10</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px;
            color: white;
        }

        h1 {
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #888;
        }

        .tier-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-bottom: 60px;
            width: 100%;
            max-width: 1400px;
        }

        .section-title {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            line-height: 0.1em;
            margin: 10px 0 20px;
        }

        .section-title span {
            background: #1a1a1a;
            padding: 0 10px;
        }

        .tier-badge {
            width: 100px;
            height: 100px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .tier-badge:hover {
            transform: scale(1.1);
            z-index: 10;
        }

        .tier-num {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .tier-name {
            font-size: 0.6rem;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* --- MATERIAL TIERS --- */

        /* Tiers 1-3: PLASTIC / BASIC */
        .mat-plastic {
            background: linear-gradient(135deg, #e2e8f0, #94a3b8);
            box-shadow: 2px 2px 0 #475569;
            color: #334155;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .mat-plastic-2 {
            background: linear-gradient(135deg, #bfdbfe, #60a5fa);
            color: #1e3a8a;
            box-shadow: 2px 2px 0 #2563eb;
        }

        .mat-plastic-3 {
            background: linear-gradient(135deg, #bbf7d0, #4ade80);
            color: #14532d;
            box-shadow: 2px 2px 0 #16a34a;
        }

        /* Tiers 4-6: METAL / INDUSTRIAL */
        .mat-metal {
            background: linear-gradient(45deg, #78716c 0%, #d6d3d1 50%, #78716c 100%);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5), 0 5px 10px rgba(0, 0, 0, 0.3);
            color: #292524;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
            border: 2px solid #57534e;
        }

        .mat-bronze {
            background: linear-gradient(45deg, #7c2d12 0%, #ea580c 50%, #7c2d12 100%);
            color: #431407;
            border-color: #9a3412;
        }

        .mat-steel {
            background: linear-gradient(45deg, #374151 0%, #9ca3af 50%, #374151 100%);
            color: #fff;
            border-color: #1f2937;
            text-shadow: 0 2px 4px black;
        }

        /* Tiers 7-9: GLASS / ENERGY */
        .mat-glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            color: white;
            overflow: hidden;
        }

        .mat-glass::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        .mat-energy-blue {
            box-shadow: 0 0 15px #3b82f6, inset 0 0 10px #3b82f6;
            border-color: #60a5fa;
            color: #eff6ff;
            text-shadow: 0 0 5px #3b82f6;
        }

        .mat-energy-gold {
            box-shadow: 0 0 15px #eab308, inset 0 0 10px #eab308;
            border-color: #fde047;
            color: #fefce8;
            text-shadow: 0 0 5px #eab308;
        }

        /* Tier 10: ETHEREAL / HOLOGRAPHIC */
        .mat-holo {
            background: black;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            color: transparent;
            /* Holo Text */
            background: linear-gradient(90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            background-size: 200%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: holo-shift 2s linear infinite;
        }

        .mat-holo::after {
            content: '';
            position: absolute;
            inset: -5px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            animation: spin 10s linear infinite;
        }

        @keyframes shine {
            0% {
                transform: translate(-100%, -100%) rotate(45deg);
            }

            100% {
                transform: translate(100%, 100%) rotate(45deg);
            }
        }

        @keyframes holo-shift {
            to {
                background-position: 200% center;
            }
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <h1>Progression Tiers</h1>

    <div class="section-title"><span>Phase 1: Foundation (Plastic)</span></div>
    <div class="tier-row">
        <div class="tier-badge mat-plastic">
            <div class="tier-num">1</div>
            <div class="tier-name">Novice</div>
        </div>
        <div class="tier-badge mat-plastic-2">
            <div class="tier-num">2</div>
            <div class="tier-name">Apprentice</div>
        </div>
        <div class="tier-badge mat-plastic-3">
            <div class="tier-num">3</div>
            <div class="tier-name">Junior</div>
        </div>
    </div>

    <div class="section-title"><span>Phase 2: Industry (Metal)</span></div>
    <div class="tier-row">
        <div class="tier-badge mat-metal mat-bronze">
            <div class="tier-num">4</div>
            <div class="tier-name">Trader</div>
        </div>
        <div class="tier-badge mat-metal">
            <div class="tier-num">5</div>
            <div class="tier-name">Senior</div>
        </div>
        <div class="tier-badge mat-metal mat-steel">
            <div class="tier-num">6</div>
            <div class="tier-name">Analyst</div>
        </div>
    </div>

    <div class="section-title"><span>Phase 3: Mastery (Energy)</span></div>
    <div class="tier-row">
        <div class="tier-badge mat-glass">
            <div class="tier-num">7</div>
            <div class="tier-name">Principal</div>
        </div>
        <div class="tier-badge mat-glass mat-energy-blue">
            <div class="tier-num">8</div>
            <div class="tier-name">Director</div>
        </div>
        <div class="tier-badge mat-glass mat-energy-gold">
            <div class="tier-num">9</div>
            <div class="tier-name">Partner</div>
        </div>
    </div>

    <div class="section-title"><span>Phase 4: Transcendence (Holo)</span></div>
    <div class="tier-row">
        <div class="tier-badge mat-holo">
            <div class="tier-num">10</div>
            <div class="tier-name">Legend</div>
        </div>
    </div>

</body>

</html>
