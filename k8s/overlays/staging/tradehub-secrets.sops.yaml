apiVersion: v1
kind: Secret
metadata:
  name: tradehub-secrets
  namespace: tradehub
  annotations:
    tradehub.io/bootstrap-only: "replace placeholders and encrypt with SOPS before Argo CD sync"
type: Opaque
stringData:
  POSTGRES_USER: "tradehub"
  POSTGRES_DB: "tradehub"
  POSTGRES_PASSWORD: "REPLACE_WITH_SOPS"
  DATABASE_URL: "postgresql://tradehub:REPLACE_WITH_SOPS@postgres.tradehub.svc.cluster.local:5432/tradehub"
  VALKEY_URL: "redis://valkey.tradehub.svc.cluster.local:6379/0"
  LEGAL_TERMS_HMAC_SECRET: "REPLACE_WITH_SOPS"
  SESSION_SECRET: "REPLACE_WITH_SOPS"
  ENCRYPTION_KEY: "REPLACE_WITH_64_HEX"
  EMAIL_VERIFY_TOKEN_SECRET: "REPLACE_WITH_SOPS"
  RESEND_API_KEY: "REPLACE_WITH_VENDOR_KEY"
  TWELVE_DATA_API_KEY: "REPLACE_WITH_VENDOR_KEY"
  FORGE_KEY: ""
  TWILIO_ACCOUNT_SID: "REPLACE_WITH_VENDOR_KEY"
  TWILIO_AUTH_TOKEN: "REPLACE_WITH_VENDOR_KEY"
  TWILIO_MESSAGING_SERVICE_SID: "REPLACE_WITH_VENDOR_KEY_OR_BLANK"
  TWILIO_FROM_NUMBER: "REPLACE_WITH_VENDOR_VALUE_OR_BLANK"
  SMS_OTP_SECRET: "REPLACE_WITH_SOPS"
  CHALLENGE_CERT_VERIFICATION_SECRET: "REPLACE_WITH_SOPS"
  EXPORT_LOCAL_LINK_SIGNING_SECRET: "REPLACE_WITH_SOPS"
  METRICS_AUTH_TOKEN: "REPLACE_WITH_SOPS"
  CLICKHOUSE_USER: "tradehub"
  CLICKHOUSE_PASSWORD: "REPLACE_WITH_SOPS"
  EXPORT_OBJECT_STORAGE_ACCESS_KEY: "REPLACE_WITH_SOPS"
  EXPORT_OBJECT_STORAGE_SECRET_KEY: "REPLACE_WITH_SOPS"
