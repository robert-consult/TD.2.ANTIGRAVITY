apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradehub-worker
  namespace: tradehub
  labels:
    app: tradehub-worker
    role: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradehub-worker
  template:
    metadata:
      labels:
        app: tradehub-worker
        role: worker
    spec:
      containers:
        - name: worker
          image: registry.equitywaves.com/tradehub/app:local-20260113-001036
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_ROLE
              value: "worker"
          envFrom:
            - configMapRef:
                name: tradehub-config
            - secretRef:
                name: tradehub-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      terminationGracePeriodSeconds: 30
