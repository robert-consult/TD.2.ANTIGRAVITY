# Headlamp Plugin Configurations
# Mounts custom settings to enhance Headlamp's default view for TradeHub petascale ops.
apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-plugins-config
  namespace: tradehub
data:
  # Filter Headlamp's default view to tradehub namespace only
  config.json: |
    {
      "clusters": [
        {
          "name": "tradehub-petascale",
          "server": "https://kubernetes.default.svc",
          "defaultNamespace": "tradehub"
        }
      ],
      "plugins": {
        "prometheus": {
          "enabled": true,
          "url": "http://tradehub-prometheus.tradehub.svc:9090"
        }
      },
      "externalLinks": [
        {
          "label": "Grafana — System Health",
          "url": "/grafana/d/th-bare-metal",
          "icon": "dashboard"
        },
        {
          "label": "Grafana — Export Pipeline",
          "url": "/grafana/d/th-export-pipeline",
          "icon": "dashboard"
        },
        {
          "label": "Grafana — Cache Health",
          "url": "/grafana/d/th-cache-health",
          "icon": "dashboard"
        },
        {
          "label": "MinIO Console",
          "url": "http://tradehub-minio.tradehub.svc:9001",
          "icon": "storage"
        }
      ]
    }
# Headlamp Deployment is defined in ops/kubernetes/headlamp-deployment.yaml.
