<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeHub — MinIO Storage Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --card: #21242f;
            --border: #2d3142;
            --text: #e0e6f0;
            --dim: #8892a8;
            --blue: #3b82f6;
            --green: #22c55e;
            --orange: #f59e0b;
            --red: #ef4444;
            --purple: #a855f7;
            --cyan: #06b6d4;
            --radius: 12px;
            --shadow: 0 4px 24px rgba(0, 0, 0, .4);
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 24px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--blue), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .header .badge {
            background: var(--green);
            color: #000;
            padding: 2px 10px;
            border-radius: 99px;
            font-size: .75rem;
            font-weight: 600;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform .15s, border-color .15s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--blue);
        }

        .stat-card .label {
            font-size: .75rem;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--dim);
            margin-bottom: 4px;
        }

        .stat-card .value {
            font-size: 1.75rem;
            font-weight: 700;
        }

        .stat-card .value.blue {
            color: var(--blue);
        }

        .stat-card .value.green {
            color: var(--green);
        }

        .stat-card .value.orange {
            color: var(--orange);
        }

        .stat-card .value.red {
            color: var(--red);
        }

        .stat-card .value.purple {
            color: var(--purple);
        }

        .stat-card .value.cyan {
            color: var(--cyan);
        }

        .stat-card .delta {
            font-size: .75rem;
            margin-top: 4px;
        }

        .chart-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .chart-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .chart-card h3 {
            font-size: .9rem;
            color: var(--dim);
            margin-bottom: 12px;
        }

        canvas {
            width: 100% !important;
        }

        .table-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .85rem;
        }

        th {
            text-align: left;
            padding: 10px 12px;
            font-weight: 600;
            color: var(--dim);
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }

        tr:hover td {
            background: rgba(59, 130, 246, .05);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-dot.up {
            background: var(--green);
        }

        .status-dot.down {
            background: var(--red);
        }

        .refresh-btn {
            background: linear-gradient(135deg, var(--blue), var(--purple));
            border: none;
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: .85rem;
            font-weight: 600;
            transition: opacity .15s;
        }

        .refresh-btn:hover {
            opacity: .85;
        }

        .refresh-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .chart-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>MinIO Storage Dashboard</h1>
        <span class="badge" id="statusBadge">LIVE</span>
        <span style="flex:1"></span>
        <span style="color:var(--dim);font-size:.8rem" id="lastUpdate">Last updated: —</span>
        <button class="refresh-btn" id="refreshBtn" onclick="fetchAll()">⟳ Refresh</button>
    </div>

    <div class="grid" id="statsGrid">
        <div class="stat-card">
            <div class="label">Total Buckets</div>
            <div class="value blue" id="totalBuckets">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Total Objects</div>
            <div class="value green" id="totalObjects">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Total Size</div>
            <div class="value purple" id="totalSize">—</div>
        </div>
        <div class="stat-card">
            <div class="label">Online Disks</div>
            <div class="value cyan" id="onlineDisks">—</div>
        </div>
        <div class="stat-card">
            <div class="label">S3 GET Requests</div>
            <div class="value orange" id="s3Gets">—</div>
        </div>
        <div class="stat-card">
            <div class="label">S3 PUT Requests</div>
            <div class="value blue" id="s3Puts">—</div>
        </div>
    </div>

    <div class="chart-row">
        <div class="chart-card">
            <h3>Bucket Size Distribution</h3><canvas id="bucketSizeChart" height="250"></canvas>
        </div>
        <div class="chart-card">
            <h3>API Request Rate (5m)</h3><canvas id="apiRateChart" height="250"></canvas>
        </div>
    </div>

    <div class="chart-row">
        <div class="chart-card">
            <h3>Disk Usage</h3><canvas id="diskChart" height="250"></canvas>
        </div>
        <div class="chart-card">
            <h3>Network I/O</h3><canvas id="networkChart" height="250"></canvas>
        </div>
    </div>

    <div class="table-card">
        <h3 style="margin-bottom:12px;color:var(--dim)">Bucket Details</h3>
        <table id="bucketsTable">
            <thead>
                <tr>
                    <th>Bucket</th>
                    <th>Objects</th>
                    <th>Size</th>
                    <th>Created</th>
                </tr>
            </thead>
            <tbody id="bucketsBody">
                <tr>
                    <td colspan="4" style="text-align:center;color:var(--dim)">Loading…</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const PROMETHEUS_URL = window.location.origin.replace(/:\d+$/, ':9090');
        const MINIO_METRICS_URL = window.location.origin + '/minio/v2/metrics/cluster';

        // Chart.js global defaults
        Chart.defaults.color = '#8892a8';
        Chart.defaults.borderColor = '#2d3142';
        Chart.defaults.font.family = "'Inter', sans-serif";

        const gradient = (ctx, c1, c2) => {
            const g = ctx.createLinearGradient(0, 0, 0, 250);
            g.addColorStop(0, c1); g.addColorStop(1, c2); return g;
        };

        // ── Bucket Size Doughnut ──────────────────────────────────────────────
        const bucketSizeCtx = document.getElementById('bucketSizeChart').getContext('2d');
        const bucketSizeChart = new Chart(bucketSizeCtx, {
            type: 'doughnut',
            data: { labels: [], datasets: [{ data: [], backgroundColor: ['#3b82f6', '#22c55e', '#f59e0b', '#ef4444', '#a855f7', '#06b6d4', '#ec4899', '#14b8a6'], borderWidth: 0, borderRadius: 4 }] },
            options: { responsive: true, cutout: '65%', plugins: { legend: { position: 'right', labels: { padding: 12, usePointStyle: true, pointStyle: 'circle' } } } }
        });

        // ── API Rate Line Chart ───────────────────────────────────────────────
        const apiRateCtx = document.getElementById('apiRateChart').getContext('2d');
        const apiRateChart = new Chart(apiRateCtx, {
            type: 'line',
            data: {
                labels: [], datasets: [
                    { label: 'GET', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,.1)', fill: true, tension: .4, pointRadius: 0, borderWidth: 2 },
                    { label: 'PUT', data: [], borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,.1)', fill: true, tension: .4, pointRadius: 0, borderWidth: 2 }
                ]
            },
            options: { responsive: true, interaction: { mode: 'index', intersect: false }, scales: { y: { beginAtZero: true, grid: { color: '#2d3142' } }, x: { grid: { display: false } } } }
        });

        // ── Disk Usage Bar ────────────────────────────────────────────────────
        const diskCtx = document.getElementById('diskChart').getContext('2d');
        const diskChart = new Chart(diskCtx, {
            type: 'bar',
            data: { labels: ['Used', 'Free'], datasets: [{ data: [0, 0], backgroundColor: [gradient(diskCtx, '#a855f7', '#6366f1'), gradient(diskCtx, '#22c55e', '#06b6d4')], borderRadius: 8, borderSkipped: false }] },
            options: { responsive: true, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { grid: { color: '#2d3142' } }, y: { grid: { display: false } } } }
        });

        // ── Network I/O Bar ───────────────────────────────────────────────────
        const netCtx = document.getElementById('networkChart').getContext('2d');
        const networkChart = new Chart(netCtx, {
            type: 'bar',
            data: { labels: ['Received', 'Sent'], datasets: [{ data: [0, 0], backgroundColor: [gradient(netCtx, '#3b82f6', '#06b6d4'), gradient(netCtx, '#f59e0b', '#ef4444')], borderRadius: 8, borderSkipped: false }] },
            options: { responsive: true, indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { grid: { color: '#2d3142' } }, y: { grid: { display: false } } } }
        });

        function humanSize(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, i)).toFixed(1) + ' ' + units[i];
        }

        function humanNum(n) { return n != null ? n.toLocaleString() : '—'; }

        // ── Fetch from Prometheus ─────────────────────────────────────────────
        async function promQuery(query) {
            try {
                const r = await fetch(`${PROMETHEUS_URL}/api/v1/query?query=${encodeURIComponent(query)}`);
                const j = await r.json();
                return j?.data?.result || [];
            } catch { return []; }
        }

        async function fetchAll() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true; btn.textContent = '⟳ Fetching…';

            try {
                const [buckets, objects, totalUsed, totalFree, onDisks, offDisks, rxBytes, txBytes, getOps, putOps] = await Promise.all([
                    promQuery('minio_cluster_bucket_total'),
                    promQuery('minio_cluster_objects_total'),
                    promQuery('minio_cluster_usage_total_bytes'),
                    promQuery('minio_cluster_usage_free_bytes'),
                    promQuery('minio_cluster_disk_online_total'),
                    promQuery('minio_cluster_disk_offline_total'),
                    promQuery('minio_node_io_read_bytes'),
                    promQuery('minio_node_io_write_bytes'),
                    promQuery('rate(minio_s3_requests_total{api="getobject"}[5m])'),
                    promQuery('rate(minio_s3_requests_total{api="putobject"}[5m])')
                ]);

                // Stats
                document.getElementById('totalBuckets').textContent = buckets[0]?.value?.[1] || '—';
                document.getElementById('totalObjects').textContent = humanNum(Number(objects[0]?.value?.[1]));
                const usedBytes = Number(totalUsed[0]?.value?.[1] || 0);
                const freeBytes = Number(totalFree[0]?.value?.[1] || 0);
                document.getElementById('totalSize').textContent = humanSize(usedBytes);
                document.getElementById('onlineDisks').textContent = `${onDisks[0]?.value?.[1] || '—'} / ${(Number(onDisks[0]?.value?.[1] || 0) + Number(offDisks[0]?.value?.[1] || 0))}`;
                document.getElementById('s3Gets').textContent = (Number(getOps[0]?.value?.[1] || 0)).toFixed(1) + '/s';
                document.getElementById('s3Puts').textContent = (Number(putOps[0]?.value?.[1] || 0)).toFixed(1) + '/s';

                // Disk chart
                diskChart.data.datasets[0].data = [usedBytes, freeBytes];
                diskChart.data.labels = [`Used (${humanSize(usedBytes)})`, `Free (${humanSize(freeBytes)})`];
                diskChart.update();

                // Network chart  
                const rx = Number(rxBytes[0]?.value?.[1] || 0);
                const tx = Number(txBytes[0]?.value?.[1] || 0);
                networkChart.data.datasets[0].data = [rx, tx];
                networkChart.data.labels = [`Received (${humanSize(rx)})`, `Sent (${humanSize(tx)})`];
                networkChart.update();

                // Bucket breakdown (from Prometheus bucket-level metrics if available)
                const bucketData = await promQuery('minio_bucket_usage_total_bytes');
                if (bucketData.length > 0) {
                    bucketSizeChart.data.labels = bucketData.map(b => b.metric?.bucket || 'unknown');
                    bucketSizeChart.data.datasets[0].data = bucketData.map(b => Number(b.value?.[1] || 0));
                    bucketSizeChart.update();

                    const tbody = document.getElementById('bucketsBody');
                    tbody.innerHTML = bucketData.map(b => {
                        const name = b.metric?.bucket || 'unknown';
                        const size = Number(b.value?.[1] || 0);
                        return `<tr><td><span class="status-dot up"></span>${name}</td><td>—</td><td>${humanSize(size)}</td><td>—</td></tr>`;
                    }).join('');
                }

                document.getElementById('statusBadge').textContent = 'LIVE';
                document.getElementById('statusBadge').style.background = 'var(--green)';
            } catch (err) {
                document.getElementById('statusBadge').textContent = 'ERROR';
                document.getElementById('statusBadge').style.background = 'var(--red)';
                console.error('Fetch error:', err);
            }

            document.getElementById('lastUpdate').textContent = 'Last updated: ' + new Date().toLocaleTimeString();
            btn.disabled = false; btn.textContent = '⟳ Refresh';
        }

        // Auto-refresh every 30s
        fetchAll();
        setInterval(fetchAll, 30000);
    </script>
</body>

</html>
