<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Badge Stage 4: Heraldic (Refined)</title>
    <style>
        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .heraldic-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shield {
            width: 140px;
            height: 160px;
            background: linear-gradient(to bottom, #1e3a8a, #000);
            clip-path: path("M 70 0 C 140 0 140 40 140 80 C 140 120 70 160 70 160 C 70 160 0 120 0 80 C 0 40 0 0 70 0");
            border: 4px solid #d4af37;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Crossed Swords (CSS lines) */
        .sword {
            position: absolute;
            width: 200px;
            height: 10px;
            background: silver;
            z-index: 1;
        }

        .s1 {
            transform: rotate(45deg);
        }

        .s2 {
            transform: rotate(-45deg);
        }

        .crown {
            position: absolute;
            top: 0;
            font-size: 2rem;
            color: #d4af37;
            z-index: 3;
            filter: drop-shadow(0 2px 4px black);
        }
    </style>
</head>

<body>
    <div class="heraldic-wrapper">
        <div class="sword s1"></div>
        <div class="sword s2"></div>
        <div class="crown">👑</div>
        <div class="shield">
            <div style="font-size:2rem;">🛡️</div>
        </div>
    </div>
</body>

</html>
