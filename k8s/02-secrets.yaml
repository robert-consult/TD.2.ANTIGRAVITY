apiVersion: v1
kind: Secret
metadata:
  name: tradehub-secrets
  namespace: tradehub
type: Opaque
stringData:
  DATABASE_URL: "postgresql://tradehub:change-me@pgbouncer.tradehub.svc.cluster.local:6432/tradehub"
  VALKEY_URL: "redis://valkey.tradehub.svc.cluster.local:6379/0"
  POSTGRES_USER: "tradehub"
  POSTGRES_PASSWORD: "change-me"
  POSTGRES_DB: "tradehub"
  SESSION_SECRET: "change-me"
  LEGAL_TERMS_HMAC_SECRET: "change-me-min-32-chars-change-me"
  # 32-byte AES key encoded as 64 hex characters (`openssl rand -hex 32`)
  ENCRYPTION_KEY: "change-me-64-hex-characters"
  FORGE_KEY: "change-me"
  RESEND_API_KEY: "change-me"
  EMAIL_VERIFY_TOKEN_SECRET: ""
  EMAIL_FROM: "TradeQuip <noreply@tradequip.com>"
  TWILIO_ACCOUNT_SID: "change-me"
  TWILIO_AUTH_TOKEN: "change-me"
  TWILIO_MESSAGING_SERVICE_SID: "change-me"
  TWILIO_FROM_NUMBER: "change-me"
  EXPORT_OBJECT_STORAGE_ACCESS_KEY: "change-me"
  EXPORT_OBJECT_STORAGE_SECRET_KEY: "change-me"
  EXPORT_OBJECT_STORAGE_REGION: "us-east-1"
  EXPORT_LOCAL_LINK_SIGNING_SECRET: "change-me-min-32-chars-change-me"
  CLICKHOUSE_USER: "tradehub"
  CLICKHOUSE_PASSWORD: "change-me"
