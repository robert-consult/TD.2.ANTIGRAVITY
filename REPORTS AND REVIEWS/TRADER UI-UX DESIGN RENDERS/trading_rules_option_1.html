<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 1: Deep Space Glass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: "hsl(var(--background))",
                        foreground: "hsl(var(--foreground))",
                        card: "hsl(var(--card))",
                        "card-foreground": "hsl(var(--card-foreground))",
                        popover: "hsl(var(--popover))",
                        "popover-foreground": "hsl(var(--popover-foreground))",
                        primary: "hsl(var(--primary))",
                        "primary-foreground": "hsl(var(--primary-foreground))",
                        secondary: "hsl(var(--secondary))",
                        "secondary-foreground": "hsl(var(--secondary-foreground))",
                        muted: "hsl(var(--muted))",
                        "muted-foreground": "hsl(var(--muted-foreground))",
                        accent: "hsl(var(--accent))",
                        "accent-foreground": "hsl(var(--accent-foreground))",
                        destructive: "hsl(var(--destructive))",
                        "destructive-foreground": "hsl(var(--destructive-foreground))",
                        border: "hsl(var(--border))",
                        input: "hsl(var(--input))",
                        ring: "hsl(var(--ring))",
                    },
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        display: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --background: 222 47% 3%;
            --foreground: 0 0% 95%;
            --card: 222 40% 8%;
            --card-foreground: 0 0% 95%;
            --popover: 222 40% 8%;
            --popover-foreground: 0 0% 95%;
            --primary: 187 100% 50%;
            --primary-foreground: 222 47% 5%;
            --secondary: 222 30% 12%;
            --secondary-foreground: 0 0% 90%;
            --muted: 222 20% 18%;
            --muted-foreground: 200 10% 55%;
            --accent: 222 25% 15%;
            --accent-foreground: 0 0% 95%;
            --destructive: 0 72% 51%;
            --destructive-foreground: 0 0% 100%;
            --border: 222 20% 15%;
            --input: 222 20% 12%;
            --ring: 187 100% 50%;
            --radius: 0.75rem;
        }

        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
        }

        /* Deep Space Glass Effect */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.36);
        }
    </style>
</head>

<body class="p-8 min-h-screen flex flex-col items-center justify-center">

    <div class="w-full max-w-lg">
        <!-- OPTION 1 -->
        <div class="relative group">
            <div
                class="absolute -inset-1 bg-gradient-to-r from-cyan-500/20 to-blue-600/20 rounded-xl blur opacity-25 group-hover:opacity-50 transition duration-1000">
            </div>
            <div class="relative bg-card rounded-xl border border-border p-6 shadow-2xl">
                <div class="mb-4">
                    <h2 class="text-xl font-display font-bold text-white flex items-center gap-2">
                        <span class="w-1 h-6 bg-primary rounded-full"></span>
                        Option 1: Deep Space Glass
                    </h2>
                    <p class="text-xs text-muted-foreground mt-1">Futuristic, high-tech, "Head-Up Display" aesthetic.
                    </p>
                </div>

                <!-- Mock inputs to set context -->
                <div class="grid grid-cols-2 gap-4 mb-6 opacity-40 hover:opacity-100 transition-opacity">
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-green-500">Take Profit</label>
                        <div
                            class="h-10 rounded-md border border-green-500/30 bg-background/50 flex items-center px-3 font-mono text-green-400">
                            145.099</div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-sm font-medium text-red-500">Stop Loss</label>
                        <div
                            class="h-10 rounded-md border border-red-500/30 bg-background/50 flex items-center px-3 font-mono text-red-400">
                            144.699</div>
                    </div>
                </div>

                <!-- THE DESIGN COMPONENT -->
                <div class="glass-panel rounded-lg p-4 relative overflow-hidden">
                    <div
                        class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent">
                    </div>

                    <div class="flex items-center gap-2 mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="text-primary">
                            <circle cx="12" cy="12" r="10" />
                            <line x1="12" x2="12" y1="16" y2="12" />
                            <line x1="12" x2="12.01" y1="8" y2="8" />
                        </svg>
                        <h3 class="text-xs font-bold uppercase tracking-widest text-primary/80">Trading Rules</h3>
                    </div>

                    <div class="space-y-2 font-mono text-xs">
                        <div class="flex items-start gap-3 group/item">
                            <div
                                class="mt-1 w-1.5 h-1.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]">
                            </div>
                            <p class="text-green-400/90 leading-relaxed">
                                Take Profit must be above current price by <span
                                    class="text-green-300 font-bold bg-green-500/10 px-1 rounded">20+ pips</span>
                            </p>
                        </div>
                        <div class="flex items-start gap-3 group/item">
                            <div class="mt-1 w-1.5 h-1.5 rounded-full bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.6)]">
                            </div>
                            <p class="text-red-400/90 leading-relaxed">
                                Stop Loss must be below current price by <span
                                    class="text-red-300 font-bold bg-red-500/10 px-1 rounded">20+ pips</span>
                            </p>
                        </div>
                    </div>
                </div>
                <!-- END DESIGN COMPONENT -->

            </div>
        </div>
    </div>

</body>

</html>
