buildscript {
    ext {
        buildToolsVersion = "36.1.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        agpVersion = "8.12.0"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:$agpVersion")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        // Firebase
        classpath("com.google.gms:google-services:4.4.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            url("$rootDir/../node_modules/@notifee/react-native/android/libs")
        }
        google()
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "app.notifee" && details.requested.name == "core" && details.requested.version == "+") {
                details.useVersion("202108261754")
                details.because("Use the packaged Notifee core artifact instead of resolving dynamic metadata from JitPack")
            }
        }
    }
}
