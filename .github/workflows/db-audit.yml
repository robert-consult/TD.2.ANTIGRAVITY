name: DB Audit

on:
  pull_request:
    paths:
      - "db/**"
      - "shared/schema*.ts"
      - "drizzle.config.ts"
      - "scripts/dbAudit.ts"
      - "scripts/dbDumpSchema.ts"
  push:
    paths:
      - "db/**"
      - "shared/schema*.ts"
      - "drizzle.config.ts"
      - "scripts/dbAudit.ts"
      - "scripts/dbDumpSchema.ts"

jobs:
  db-audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run db:migrate:drizzle
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      - run: npm run db:audit
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
