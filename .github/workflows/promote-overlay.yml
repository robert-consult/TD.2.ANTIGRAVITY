name: Promote Overlay

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Overlay to promote
        required: true
        type: choice
        options:
          - staging
          - prod
      image:
        description: Fully qualified image ref (for example ghcr.io/org/tradequip:git-abcdef)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Update overlay image
        run: npx tsx scripts/ops/updateKustomizeImage.ts --overlay ${{ inputs.environment }} --image ${{ inputs.image }}

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/promote-${{ inputs.environment }}-${{ github.run_id }}
          title: Promote ${{ inputs.environment }} to ${{ inputs.image }}
          commit-message: Promote ${{ inputs.environment }} to ${{ inputs.image }}
          body: |
            Automated overlay promotion.

            Environment: `${{ inputs.environment }}`
            Image: `${{ inputs.image }}`
          labels: |
            deployment
            gitops
