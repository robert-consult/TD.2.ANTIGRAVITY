apiVersion: v1
kind: Service
metadata:
  name: tradehub-postgres-exporter
  namespace: tradehub
  labels:
    app: tradehub-postgres-exporter
spec:
  selector:
    app: tradehub-postgres-exporter
  ports:
    - name: metrics
      port: 9630
      targetPort: 9630
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradehub-postgres-exporter
  namespace: tradehub
  labels:
    app: tradehub-postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradehub-postgres-exporter
  template:
    metadata:
      labels:
        app: tradehub-postgres-exporter
    spec:
      containers:
        - name: pg-exporter
          image: pgsty/pg_exporter:1.2.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9630
              name: metrics
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tradehub-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tradehub-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: tradehub-secrets
                  key: POSTGRES_DB
            - name: PG_EXPORTER_URL
              value: "host=postgres.tradehub.svc.cluster.local port=5432 user=$(POSTGRES_USER) password=$(POSTGRES_PASSWORD) dbname=$(POSTGRES_DB) sslmode=disable"
            - name: PG_EXPORTER_AUTO_DISCOVER_DATABASES
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 9630
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 9630
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
