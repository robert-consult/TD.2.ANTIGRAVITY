global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: "tradehub-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["tradehub-api:5000"]

  - job_name: "tradehub-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["tradehub-worker:5000"]

  - job_name: "minio"
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: "clickhouse"
    metrics_path: /metrics
    static_configs:
      - targets: ["clickhouse:8123"]

  - job_name: "valkey_exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]
