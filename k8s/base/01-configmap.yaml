apiVersion: v1
kind: ConfigMap
metadata:
  name: tradehub-config
  namespace: tradehub
data:
  NODE_ENV: "production"
  APP_URL: "https://tradehub.example.com"
  DB_DIALECT: "postgres"
  SESSION_STORE: "valkey"
  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: "lax"
  TRANSPORT_REQUIRE_TLS: "true"
  METRICS_REQUIRE_PRIVATE: "true"
  MARKET_DATA_PROVIDER_FILE_SYNC: "1"
  MARKET_DATA_PROVIDER_CONFIG_DIR: "/app/config/marketdata/providers"
  MARKET_DATA_PROVIDER_ALLOW_ENV_FALLBACK: "0"
  LIVEBUS_VALKEY_ENABLED: "true"
  LIVE_ACCOUNT_THROTTLE_MS: "1000"
  QUOTE_STALE_AFTER_MS: "300000"
  WS_JURISDICTION_RECHECK_MS: "30000"
  QUOTE_DB_WRITE_MODE: "interval"
  QUOTE_DB_WRITE_INTERVAL_MS: "60000"
  DAILY_CLOSE_WRITE_INTERVAL_MS: "60000"
  ACCOUNT_RECALC_THROTTLE_MS: "3000"
  ACCOUNT_RECALC_BATCH_INTERVAL_MS: "1000"
  ADMIN_DATA_EXPORT_QUEUE_ENABLED: "1"
  ADMIN_DATA_EXPORT_QUEUE_NAME: "admin-export-v1"
  ADMIN_DATA_EXPORT_QUEUE_CONCURRENCY: "4"
  ADMIN_DATA_EXPORT_MAX_ATTEMPTS: "6"
  ADMIN_DATA_EXPORT_BACKOFF_MS: "10000"
  ADMIN_DATA_EXPORT_RETENTION_SEC: "604800"
  ADMIN_DATA_EXPORT_RETENTION_SWEEP_ENABLED: "1"
  ADMIN_DATA_EXPORT_RETENTION_SWEEP_INTERVAL_SEC: "600"
  ADMIN_DATA_EXPORT_RETENTION_SWEEP_BATCH_LIMIT: "200"
  EXPORT_OBJECT_STORAGE_ENABLED: "1"
  EXPORT_OBJECT_STORAGE_ENDPOINT: "tradehub-minio.tradehub.svc.cluster.local"
  EXPORT_OBJECT_STORAGE_PORT: "9000"
  EXPORT_OBJECT_STORAGE_USE_SSL: "false"
  EXPORT_OBJECT_STORAGE_BUCKET: "admin-data-exports"
  EXPORT_OBJECT_STORAGE_PREFIX: "admin-data"
  EXPORT_OBJECT_STORAGE_LINK_TTL_SEC: "900"
  ADMIN_DATA_EXPORT_LOCAL_DIR: "/tmp/admin-data-exports"
  CLICKHOUSE_ENABLED: "1"
  CLICKHOUSE_URL: "http://tradehub-clickhouse.tradehub.svc.cluster.local:8123"
  CLICKHOUSE_DATABASE: "tradehub"
  CLICKHOUSE_SYNC_ENABLED: "1"
  CLICKHOUSE_SYNC_INTERVAL_SEC: "300"
  CLICKHOUSE_SYNC_BATCH_SIZE: "20000"
  CLICKHOUSE_SYNC_MAX_LOOPS_PER_TICK: "4"
  # Internal TLS manifests exist under ops/kubernetes/75-internal-tls.yaml. Keep the
  # private-network exception enabled until service TLS mounts and client CA trust are
  # wired end-to-end in the active overlay.
  ALLOW_INSECURE_INTERNAL_TRANSPORT: "1"
  # Expose queue internals only when explicitly needed for debugging.
  BULL_BOARD_ENABLED: "0"
