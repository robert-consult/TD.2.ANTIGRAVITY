apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradehub-api
  namespace: tradehub
  labels:
    app: tradehub-api
    role: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tradehub-api
  template:
    metadata:
      labels:
        app: tradehub-api
        role: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.equitywaves.com/tradehub/app:local-20260113-001036
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_ROLE
              value: "api"
            - name: OTEL_TRACING_ENABLED
              value: "1"
            - name: OTEL_SERVICE_NAME
              value: "tradehub-api"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://tradehub-victoria-traces.tradehub.svc.cluster.local:10428/insert/opentelemetry/v1/traces"
          envFrom:
            - configMapRef:
                name: tradehub-config
            - secretRef:
                name: tradehub-secrets
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: migration-imports
              mountPath: /app/migration_imports
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: migration-imports
          emptyDir: {}
      terminationGracePeriodSeconds: 30
