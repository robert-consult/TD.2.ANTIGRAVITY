# Grafana Deployment & Dashboard Provisioning
#
# This file automates the deployment of Grafana into the tradehub namespace
# and dynamically provisions all 8 dashboards located in ops/dashboards/*.json.
# It uses a shell script initContainer to read the JSONs via an external ConfigMap
# or volume, but since k8s limits ConfigMap sizes, we'll deploy Grafana with 
# a sidecar that syncs dashboards, or simply map the dashboards directly via ConfigMap.

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-ds
  namespace: tradehub
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Tradehub Petascale Ops'
        origId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: tradehub
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        orgId: 1
        url: http://tradehub-prometheus.tradehub.svc.cluster.local:9090
        isDefault: true
---
# NOTE: The actual JSON dashboards (app-red-metrics.json, etc.) 
# must be applied to the cluster prior to this via:
# kubectl create configmap grafana-dashboards --from-file=ops/dashboards/ -n tradehub
# OR deployed as part of the helm chart. Assuming they are mounted via 'grafana-dashboards' ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tradehub-grafana
  namespace: tradehub
  labels:
    app: tradehub-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tradehub-grafana
  template:
    metadata:
      labels:
        app: tradehub-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.4.0
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tradehub-secrets
                  key: GRAFANA_ADMIN_PASSWORD
                  optional: true
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-cfg
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 472
      volumes:
        - name: grafana-storage
          emptyDir: {}
        - name: grafana-datasources
          configMap:
            name: grafana-datasource
        - name: grafana-dashboards-cfg
          configMap:
            name: grafana-dashboards-ds
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: tradehub-grafana
  namespace: tradehub
spec:
  type: ClusterIP
  selector:
    app: tradehub-grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
