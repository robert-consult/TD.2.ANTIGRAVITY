<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate: The Zen</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Pinyon+Script&display=swap"
        rel="stylesheet">
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }

        @media print {
            body {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }

        body {
            background-color: #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Cinzel', serif;
        }

        .certificate-sheet {
            width: 297mm;
            height: 210mm;
            background-color: #f8f8f8;
            /* Heavy Paper Texture */
            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.5' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E"),
                linear-gradient(to bottom right, #ffffff, #f0f0f0);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .embossed-logo {
            font-size: 3rem;
            color: transparent;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 1), -1px -1px 2px rgba(0, 0, 0, 0.1);
            margin-bottom: 20mm;
        }

        h1 {
            font-weight: 400;
            letter-spacing: 5px;
            font-size: 1.5rem;
            color: #555;
            margin-bottom: 10mm;
            text-transform: uppercase;
        }

        .recipient {
            font-family: 'Pinyon Script', cursive;
            /* Elegant script */
            font-size: 4rem;
            color: #333;
            margin-bottom: 15mm;
        }

        .body-text {
            max-width: 60%;
            margin: 0 auto;
            color: #777;
            font-size: 0.9rem;
            line-height: 2;
        }

        .date {
            margin-top: 20mm;
            font-size: 0.8rem;
            color: #999;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <div class="certificate-sheet">
        <div class="embossed-logo">∞</div>

        <h1>Certificate<br>Of Completion</h1>

        <div class="recipient">Stephane Name</div>

        <div class="body-text">
            For finding clarity in the noise.
            <br>
            Completing the path of minimal resistance.
        </div>

        <div class="date">APRIL 22, 2026</div>
    </div>

</body>

</html>
