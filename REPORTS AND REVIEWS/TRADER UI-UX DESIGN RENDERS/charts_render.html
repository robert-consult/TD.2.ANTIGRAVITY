<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradeQuip - Charts Render</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* Palette */
            --bg-deep: #05050A;
            --bg-chart: #080a10;
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;

            /* Accents */
            --primary-cyan: #00F0FF;
            --neon-violet: #7000FF;
            --success-green: #00FF94;
            --danger-red: #FF2A55;

            /* Glassmorphism */
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

            /* Layout */
            --sidebar-width: 260px;
            --header-height: 70px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.05) 0%, transparent 40%);
        }

        /* Typography */
        h1,
        h2,
        h3 {
            font-family: 'Rajdhani', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Layout Grid */
        .app-container {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            grid-template-rows: var(--header-height) 1fr auto;
            height: 100vh;
        }

        /* Sidebar - Floating Dock Style */
        .sidebar {
            grid-row: 1 / -1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(11, 14, 20, 0.4);
            border-right: var(--glass-border);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary-cyan), var(--neon-violet));
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.1) 0%, transparent 100%);
            border-left: 3px solid var(--primary-cyan);
            color: var(--primary-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        /* Header */
        .header {
            grid-column: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            border-bottom: var(--glass-border);
            background: rgba(5, 5, 10, 0.8);
            backdrop-filter: blur(10px);
        }

        .page-title {
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(to right, #fff, #94A3B8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .symbol-info {
            display: flex;
            flex-direction: column;
        }

        .symbol-title {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 20px;
            color: #fff;
            letter-spacing: 0.05em;
        }

        .symbol-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        .header-quote {
            text-align: right;
        }

        .header-price {
            font-family: 'JetBrains Mono', monospace;
            color: var(--success-green);
            font-size: 16px;
        }

        .header-spread {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Chart Area */
        .chart-container {
            grid-column: 2;
            position: relative;
            background: var(--bg-chart);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Simulated Grid Lines */
        .grid-lines {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        /* Simulated Candles (SVG) */
        .chart-svg {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Floating Quote Panel */
        .floating-quote {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: var(--glass-border);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 15px;
            width: 250px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            cursor: move;
        }

        .quote-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 5px 15px;
            font-size: 14px;
        }

        .quote-label {
            color: var(--text-muted);
        }

        .quote-val {
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }

        .quote-bid {
            color: var(--danger-red);
        }

        .quote-ask {
            color: var(--success-green);
        }

        /* Timeframe Selector */
        .timeframe-pill {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 5px;
            display: flex;
            gap: 5px;
            z-index: 10;
        }

        .tf-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            cursor: pointer;
        }

        .tf-btn.active {
            background: var(--primary-cyan);
            color: #000;
            font-weight: 600;
        }

        /* Trade Panel (Bottom) */
        .trade-panel {
            grid-column: 2;
            background: #111;
            border-top: var(--glass-border);
            padding: 15px 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .trade-btn {
            flex: 1;
            max-width: 200px;
            padding: 15px;
            border-radius: 8px;
            border: none;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }

        .trade-btn:hover {
            opacity: 0.9;
        }

        .trade-btn:active {
            transform: scale(0.98);
        }

        .btn-sell {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            box-shadow: 0 0 15px rgba(211, 47, 47, 0.3);
        }

        .btn-buy {
            background: linear-gradient(135deg, #2e7d32, #1b5e20);
            box-shadow: 0 0 15px rgba(46, 125, 50, 0.3);
        }

        .trade-btn span {
            font-size: 12px;
            opacity: 0.8;
            font-family: 'JetBrains Mono', monospace;
            font-weight: normal;
        }

        .lots-control {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .lots-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .lots-input {
            background: #222;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            width: 80px;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- Navigation -->
        <nav class="sidebar">
            <div class="logo">
                <div class="logo-icon"></div>
                TradeQuip
            </div>

            <a href="#" class="nav-item">
                <span>📊</span> Quotes
            </a>
            <a href="#" class="nav-item active">
                <span>📈</span> Chart
            </a>
            <a href="#" class="nav-item">
                <span>⚡</span> Trade
            </a>
            <a href="#" class="nav-item">
                <span>📜</span> History
            </a>
            <a href="#" class="nav-item">
                <span>🏆</span> Leaderboard
            </a>
            <a href="#" class="nav-item">
                <span>👤</span> Account
            </a>
        </nav>

        <!-- Header -->
        <header class="header">
            <div style="display: flex; align-items: center; gap: 15px;">
                <div class="symbol-info">
                    <div class="symbol-title">EURUSD</div>
                    <div class="symbol-subtitle">Symbol Chart</div>
                </div>
            </div>

            <div class="header-quote">
                <div class="header-price">1.09245 / 1.09248</div>
                <div class="header-spread">Spread: 0.3 pips</div>
            </div>
        </header>

        <!-- Chart Area -->
        <main class="chart-container">
            <div class="grid-lines"></div>

            <!-- Floating Quote Widget -->
            <div class="floating-quote">
                <div
                    style="display: flex; justify-content: space-between; margin-bottom: 10px; color: #fff; font-weight: 600;">
                    <span>EURUSD</span>
                    <span style="color: var(--text-muted); cursor: pointer;">✕</span>
                </div>
                <div class="quote-grid">
                    <span class="quote-label">Bid:</span>
                    <span class="quote-val quote-bid">1.09245</span>

                    <span class="quote-label">Ask:</span>
                    <span class="quote-val quote-ask">1.09248</span>

                    <span class="quote-label">Spread:</span>
                    <span class="quote-val" style="color: #fff;">0.3 pips</span>
                </div>
            </div>

            <!-- Simulated Chart SVG -->
            <svg class="chart-svg" viewBox="0 0 800 400" preserveAspectRatio="none">
                <!-- Defs for gradients -->
                <defs>
                    <linearGradient id="greenCandle" x1="0" x2="0" y1="0" y2="1">
                        <stop offset="0%" stop-color="#00FF94" />
                        <stop offset="100%" stop-color="#008F53" />
                    </linearGradient>
                    <linearGradient id="redCandle" x1="0" x2="0" y1="0" y2="1">
                        <stop offset="0%" stop-color="#FF2A55" />
                        <stop offset="100%" stop-color="#AA1130" />
                    </linearGradient>
                </defs>

                <!-- Random Candles simulation -->
                <!-- Wick -->
                <line x1="50" y1="200" x2="50" y2="280" stroke="#00FF94" stroke-width="1" />
                <rect x="40" y="220" width="20" height="40" fill="url(#greenCandle)" />

                <line x1="100" y1="210" x2="100" y2="250" stroke="#FF2A55" stroke-width="1" />
                <rect x="90" y="220" width="20" height="20" fill="url(#redCandle)" />

                <line x1="150" y1="220" x2="150" y2="300" stroke="#00FF94" stroke-width="1" />
                <rect x="140" y="230" width="20" height="50" fill="url(#greenCandle)" />

                <line x1="200" y1="180" x2="200" y2="240" stroke="#00FF94" stroke-width="1" />
                <rect x="190" y="190" width="20" height="40" fill="url(#greenCandle)" />

                <line x1="250" y1="150" x2="250" y2="200" stroke="#FF2A55" stroke-width="1" />
                <rect x="240" y="160" width="20" height="30" fill="url(#redCandle)" />

                <line x1="300" y1="170" x2="300" y2="210" stroke="#00FF94" stroke-width="1" />
                <rect x="290" y="180" width="20" height="20" fill="url(#greenCandle)" />

                <line x1="350" y1="150" x2="350" y2="250" stroke="#FF2A55" stroke-width="1" />
                <rect x="340" y="180" width="20" height="60" fill="url(#redCandle)" />

                <!-- MA Line -->
                <path d="M 0 250 Q 200 180 400 200 T 800 150" fill="none" stroke="#00F0FF" stroke-width="2"
                    opacity="0.6" />
            </svg>

            <!-- Timeframe -->
            <div class="timeframe-pill">
                <button class="tf-btn">1H</button>
                <button class="tf-btn active">1D</button>
                <button class="tf-btn">1W</button>
                <button class="tf-btn">1M</button>
            </div>
        </main>

        <!-- Bottom Trade Panel -->
        <footer class="trade-panel">
            <button class="trade-btn btn-sell">
                SELL
                <span>@ 1.09245</span>
            </button>

            <div class="lots-control">
                <span class="lots-label">LOTS</span>
                <input type="number" class="lots-input" value="1.00">
            </div>

            <button class="trade-btn btn-buy">
                BUY
                <span>@ 1.09248</span>
            </button>
        </footer>

    </div>

</body>

</html>
