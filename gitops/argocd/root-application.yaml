apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tradehub-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_GITHUB_ORG/TD.2.ANTIGRAVITY.git
    targetRevision: main
    path: gitops/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
