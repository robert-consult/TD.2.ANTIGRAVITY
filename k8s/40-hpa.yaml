apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tradehub-api
  namespace: tradehub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tradehub-api
  minReplicas: 2
  maxReplicas: 16
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: ws_active_connections
        target:
          type: AverageValue
          averageValue: "2500"
