groups:
  - name: petascale_infrastructure_alerts
    rules:
      - alert: ExportQueueLagTooHigh
        expr: bullmq_queue_waiting{queue="admin-export-v1"} > 50 AND delta(bullmq_queue_completed{queue="admin-export-v1"}[5m]) == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Admin Export Queue is starving."
          description: "Queue depth is over 50 jobs with absolutely 0 completions in the last 5 minutes. The worker nodes might be dead or deadlocked doing a heavy ClickHouse scan. Reference RUNBOOK_EXPORT_PIPELINE_INCIDENT.md."

      - alert: ClickHouseSyncLagCritical
        expr: (sum(pg_stat_user_tables_total_rows) - sum(clickhouse_table_total_rows)) > 100000
        for: 1m
        labels:
          severity: critical
          team: data
        annotations:
          summary: "ClickHouse OLAP replication lagging."
          description: "The incremental high-watermark sync worker is failing to keep up with Postgres OLTP inserts. Lag exceeds 100,000 rows. Dashboard staleness imminent. Reference RUNBOOK_ANALYTICS_STALENESS.md."

      - alert: MinIODiskFillForecast
        expr: predict_linear(minio_cluster_disk_free_bytes[1h], 24 * 3600) < 0
        for: 1h
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "MinIO Bare Metal Disks approaching exhaustion."
          description: "At the current export artifact write rate, the targeted OVH Bare Metal NVMe arrays will run completely out of storage in less than 24 hours. Clear orphaned exports."

      - alert: RouteLatencyBreach
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{route=~"/api/admin/.*"}[5m])) by (le)) > 0.5
        for: 2m
        labels:
          severity: warning
          team: api
        annotations:
          summary: "Admin DataTab 99th percentile latency > 500ms."
          description: "A fast Rollup operation or Async handler is degraded. Something is blocking the Node.js event pool, violating the heavy-work separation invariant."

      - alert: SuspiciousExportVolume
        expr: rate(admin_data_export_bytes_written_total[10m]) > 524288000
        for: 5m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Potential Data Exfiltration Event."
          description: "Over 500MB of CSV/JSONL data is actively streaming out per second. This triggers the anomaly threshold. A compromised admin account may be downloading the entire user database. Reference RUNBOOK_DATA_EXFIL_ALERT.md."
