<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Badge Stage 2: Skeuomorphic (Refined)</title>
    <style>
        body {
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .coin {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            /* Enhanced Gold Gradient */
            background: radial-gradient(ellipse at 30% 30%, #ffd700, #b8860b);
            box-shadow: 5px 10px 20px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .inner-rim {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            border: 2px dashed rgba(139, 108, 66, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lion-relief {
            font-size: 5rem;
            color: #7b591b;
            /* Emboss Text Shadow */
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.4), 0 -1px 1px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <div class="coin">
        <div class="inner-rim">
            <div class="lion-relief">🦁</div>
        </div>
    </div>
</body>

</html>
