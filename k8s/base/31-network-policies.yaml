apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tradehub-api-ingress
  namespace: tradehub
spec:
  podSelector:
    matchLabels:
      app: tradehub-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 5000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tradehub
      ports:
        - protocol: TCP
          port: 5000
---
