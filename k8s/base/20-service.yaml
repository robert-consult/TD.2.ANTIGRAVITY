apiVersion: v1
kind: Service
metadata:
  name: tradehub-api
  namespace: tradehub
  labels:
    app: tradehub-api
spec:
  type: ClusterIP
  selector:
    app: tradehub-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: tradehub-worker
  namespace: tradehub
  labels:
    app: tradehub-worker
spec:
  type: ClusterIP
  selector:
    app: tradehub-worker
  ports:
    - name: http
      port: 80
      targetPort: 5000
